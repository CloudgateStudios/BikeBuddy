name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Validate semantic PR title
  # ─────────────────────────────────────────────
  valdiate_pr_title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            docs
            refactor
            test
            ci
            chore
            revert
          requireScope: false
          
  # ─────────────────────────────────────────────
  # Job 2: Lint — SwiftLint + localization check
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: SwiftLint
        uses: cirruslabs/swiftlint-action@v1.1.0
        with:
          version: latest
          args: --strict --config ios/.swiftlint.yml

      - name: Validate localization strings
        run: python3 scripts/StringsChecker.py -p .

  # ─────────────────────────────────────────────
  # Job 3: Build & Unit Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    # iOS 27 is the deployment target, so we need the Xcode 27 SDK + an iOS 27
    # simulator to compile the iOS-27-only SwiftUI APIs (e.g.
    # `toolbarMinimizationBehavior`). The standard `macos-26` image still tops
    # out at Xcode 26.6, so use the dedicated `xcode-27` beta image, which ships
    # Xcode 27.0 (default) and the iOS 27.0 simulator runtime. Switch back to
    # `macos-latest` once Xcode 27 lands on the GA image.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          # `latest` selects the highest installed Xcode — 27.0 (beta) on the
          # xcode-27 image.
          xcode-version: latest

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/BikeBuddy.xcodeproj \
            -scheme "BikeBuddy" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/BikeBuddy.xcodeproj \
            -scheme "BikeBuddy" \
            -destination "platform=iOS Simulator,OS=27.0,name=iPhone 17" \
            -only-testing:BikeBuddyKitTests \
            -resultBundlePath build/results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Upload the full .xcresult so failures can be inspected locally.
      # (kishikawakatsumi/xcresulttool dropped — no Node 24 support)
      - name: Upload xcresult
        uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: test-results
          path: build/results.xcresult
          retention-days: 7
