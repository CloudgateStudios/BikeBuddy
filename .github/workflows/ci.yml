name: CI

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint — SwiftLint + localization check
  # Runs in parallel with build-and-test so you
  # get fast style feedback without waiting for
  # the full build.
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: SwiftLint
        uses: cirruslabs/swiftlint-action@v1.1.0
        with:
          version: latest
          args: --strict

      - name: Validate localization strings
        run: python3 scripts/StringsChecker.py -p .

  # ─────────────────────────────────────────────
  # Job 2: Build & Unit Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          # Pin to 26.3 — the latest-stable (26.4 RC) ships without an iOS
          # simulator runtime on this runner image. Xcode 26.3 has iOS 26.2
          # simulators bundled and is stable for CI.
          xcode-version: "26.3"

      - name: Build
        run: |
          xcodebuild build \
            -project ios/BikeBuddy.xcodeproj \
            -scheme "BikeBuddy" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project ios/BikeBuddy.xcodeproj \
            -scheme "BikeBuddy" \
            -destination "platform=iOS Simulator,OS=26.2,name=iPhone 17" \
            -only-testing:BikeBuddyKitTests \
            -resultBundlePath build/results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      # Upload the full .xcresult so failures can be inspected locally.
      # (kishikawakatsumi/xcresulttool dropped — no Node 24 support)
      - name: Upload xcresult
        uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: test-results
          path: build/results.xcresult
          retention-days: 7
