name: CI

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint — SwiftLint + localization check
  # Runs in parallel with build-and-test so you
  # get fast style feedback without waiting for
  # the full build.
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: SwiftLint
        uses: cirruslabs/swiftlint-action@v1
        with:
          version: latest

      - name: Validate localization strings
        run: python3 Scripts/StringsChecker.py -p .

  # ─────────────────────────────────────────────
  # Job 2: Build & Unit Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable


      - name: Build
        run: |
          xcodebuild build \
            -scheme "Bike Buddy" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme "Bike Buddy" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -only-testing:BikeBuddyKitTests \
            -resultBundlePath build/results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      # Post test pass/fail annotations directly on the PR diff.
      - name: Report test results
        uses: kishikawakatsumi/xcresulttool@v1
        if: always()
        continue-on-error: true
        with:
          path: build/results.xcresult
          show-passed-tests: false
          show-code-coverage: false

      # Upload the full .xcresult so failures can be inspected locally.
      - name: Upload xcresult
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/results.xcresult
          retention-days: 7
