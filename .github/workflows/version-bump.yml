name: Version Bump

# Run by hand from the Actions tab. Bumps MARKETING_VERSION in the Xcode
# project, commits that straight to main as "chore(release): vX.Y.Z", then
# tags it and creates the GitHub Release. Xcode Cloud starts on the vX.Y.Z tag,
# assigns its own build number, and uploads the build to App Store Connect, so
# CURRENT_PROJECT_VERSION is never bumped here.
#
# MARKETING_VERSION is set once at project level and every Info.plist reads
# $(MARKETING_VERSION), so the pbxproj is the only file that changes. Don't use
# agvtool here: new-marketing-version writes literal values back into the
# plists.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: Bump, tag and release
    runs-on: ubuntu-latest
    steps:
      # main only takes PRs. The release App is a bypass actor on the main
      # ruleset, so pushing with its token lands the bump directly.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Work out the new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Project-level Debug and Release both carry the value; they must agree.
          current=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);$/\1/p' ios/BikeBuddy.xcodeproj/project.pbxproj | sort -u)
          if ! [[ "$current" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Expected one MARKETING_VERSION in project.pbxproj, found: '$current'"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current"
          minor=${minor:-0}
          patch=${patch:-0}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi

          echo "Bumping $current → $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update the Xcode project
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i -E "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/" \
            ios/BikeBuddy.xcodeproj/project.pbxproj
          git diff --stat
          if git diff --quiet; then
            echo "::error::Nothing changed; the MARKETING_VERSION lines weren't found"
            exit 1
          fi

      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$user_id+$APP_SLUG[bot]@users.noreply.github.com"

          git commit -am "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

          gh release create "v$VERSION" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes
