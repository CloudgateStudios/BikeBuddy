name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version number (e.g. 1.8.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set marketing version
        run: xcrun agvtool new-marketing-version ${{ inputs.version }}

      - name: Increment build number
        run: |
          current=$(xcrun agvtool what-version -terse)
          new=$((current + 1))
          xcrun agvtool new-version -all $new

      - name: Commit, tag, and push
        run: |
          version=$(xcrun agvtool what-marketing-version -terse1)
          build=$(xcrun agvtool what-version -terse)
          git add "Bike Buddy.xcodeproj/project.pbxproj" \
                  "Bike Buddy/Info.plist" \
                  "BikeBuddyKit/Info.plist" \
                  "Bike BuddyUITests/Info.plist"
          git commit -m "Version Bump to ${version}-${build}"
          git tag "release/${version}/${build}"
          git push origin main --follow-tags
