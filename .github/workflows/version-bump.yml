name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version number (e.g. 1.8.0)'
        required: true
        type: string

# ADMIN_GITHUB_TOKEN secret required: a PAT belonging to an organization admin, with
# `repo` scope so it can push to main.
#
# It does not need to disable anything. The `main` ruleset grants OrganizationAdmin an
# always-on bypass, so a push authenticated as an org admin satisfies it directly. Do
# not reintroduce enforcement toggling here: a cancelled run or a dead runner skips the
# restore step and leaves main unprotected with nothing to signal it.

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set marketing version
        run: cd ios && xcrun agvtool new-marketing-version ${{ inputs.version }}

      - name: Increment build number
        run: |
          current=$(cd ios && xcrun agvtool what-version -terse)
          new=$((current + 1))
          cd ios && xcrun agvtool new-version -all $new

      - name: Commit, tag, and push
        run: |
          version=$(cd ios && xcrun agvtool what-marketing-version -terse1)
          build=$(cd ios && xcrun agvtool what-version -terse)
          git add "ios/BikeBuddy.xcodeproj/project.pbxproj" \
                  "ios/BikeBuddy/Info.plist" \
                  "ios/BikeBuddyKit/Info.plist" \
                  "ios/BikeBuddyUITests/Info.plist"
          git commit -m "Version Bump to ${version}-${build}"
          git tag -a "release/${version}/${build}" -m "Release ${version} (${build})"
          git push origin main --follow-tags
